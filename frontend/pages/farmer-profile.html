<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Farmer Profile - AgriBridge</title>

    <link
        rel="stylesheet"
        href="/frontend/styles/farmer-profile.css"
    >
    <link rel="stylesheet" href="/frontend/styles/global.css">

</head>


<body>

    <nav class="nav">
        <div class="logo">
            <a href="/frontend/pages/index.html">
                <img src="/frontend/assets/logo/logo.png" alt="AgriBridge Logo">
            </a>
        </div>

        <div class="mid">
            <a href="/frontend/pages/farmer-dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
            <a href="/frontend/pages/crop-listings.html" data-i18n="nav.marketplace">Marketplace</a>
            <a href="/frontend/pages/weather-dashboard.html" data-i18n="nav.weather">Weather</a>
            <a href="/frontend/pages/voice-assistant.html" data-i18n="nav.voiceAssistant">Voice AI</a>
            <a href="/frontend/pages/farmer-profile.html" class="active" data-i18n="nav.myProfile">Profile</a>
        </div>

        <div class="register">
            <button type="button" class="stylish-btn ab-btn-secondary" onclick="window.location.href='/frontend/pages/farmer-dashboard.html'">
                ← Back to Dashboard
            </button>
        </div>
    </nav>

    <main class="profile-page">

        <div class="profile-card">


            <!-- =====================================
                 HEADER
                 ===================================== -->

            <header class="profile-header">

                <div class="profile-icon">
                    👨‍🌾
                </div>

                <h1 data-i18n="profile.farmerProfile.title">
                    Complete Your Farmer Profile
                </h1>

                <p data-i18n="profile.farmerProfile.description">
                    Tell us a little about yourself and
                    your farm to personalize AgriBridge.
                </p>

            </header>


            <!-- =====================================
                 PROFILE FORM
                 ===================================== -->

            <form id="farmer-profile-form">


                <!-- FARMER NAME -->

                <div class="form-group">

                    <label for="farmer-name" data-i18n="profile.fields.farmerName">
                        Farmer Name
                    </label>

                    <input
                        type="text"
                        id="farmer-name"
                        name="name"
                        data-i18n-placeholder="profile.placeholders.enterFullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- FARM NAME -->

                <div class="form-group">

                    <label for="farm-name" data-i18n="profile.fields.farmName">
                        Farm Name
                    </label>

                    <input
                        type="text"
                        id="farm-name"
                        name="farmName"
                        data-i18n-placeholder="profile.placeholders.farmNameExample"
                        placeholder="e.g. Green Valley Farm"
                    >

                </div>


                <!-- FARM AREA -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="farm-area" data-i18n="profile.fields.farmArea">
                            Farm Area
                        </label>

                        <input
                            type="number"
                            id="farm-area"
                            name="farmArea"
                            data-i18n-placeholder="profile.placeholders.farmAreaExample"
                            placeholder="e.g. 5"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="area-unit" data-i18n="profile.fields.unit">
                            Unit
                        </label>

                        <select
                            id="area-unit"
                            name="farmAreaUnit"
                            required
                        >

                            <option value="acres" data-i18n="profile.units.acres">
                                Acres
                            </option>

                            <option value="hectares" data-i18n="profile.units.hectares">
                                Hectares
                            </option>

                        </select>

                    </div>

                </div>


                <!-- LOCATION -->

                <div class="form-group">

                    <label for="location" data-i18n="profile.fields.location">
                        Farm Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        data-i18n-placeholder="profile.placeholders.villageCity"
                        placeholder="Village / City"
                        required
                    >

                </div>


                <!-- STATE -->

                <div class="form-group">

                    <label for="state" data-i18n="profile.fields.state">
                        State
                    </label>

                    <select
                        id="state"
                        name="state"
                        required
                    >

                        <option value="" data-i18n="profile.selectState">
                            Select State
                        </option>

                        <option value="Madhya Pradesh">
                            Madhya Pradesh
                        </option>

                        <option value="Uttar Pradesh">
                            Uttar Pradesh
                        </option>

                        <option value="Maharashtra">
                            Maharashtra
                        </option>

                        <option value="Rajasthan">
                            Rajasthan
                        </option>

                        <option value="Punjab">
                            Punjab
                        </option>

                        <option value="Haryana">
                            Haryana
                        </option>

                        <option value="Bihar">
                            Bihar
                        </option>

                        <option value="Gujarat">
                            Gujarat
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- MAIN CROPS -->

                <div class="form-group">

                    <label for="main-crops" data-i18n="profile.fields.mainCrops">
                        Main Crops
                    </label>

                    <input
                        type="text"
                        id="main-crops"
                        name="crops"
                        data-i18n-placeholder="profile.placeholders.cropsExample"
                        placeholder="e.g. Wheat, Tomato, Potato"
                    >

                    <small data-i18n="profile.fields.cropsHint">
                        Separate multiple crops with commas.
                    </small>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone" data-i18n="profile.fields.phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        data-i18n-placeholder="profile.placeholders.enterPhone"
                        placeholder="Enter your phone number"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="continue-button"
                >                    <span data-i18n="profile.farmerProfile.continueButton">Continue to Dashboard →</span>
                </button>


                <!-- MESSAGE -->

                <p
                    id="profile-message"
                    class="profile-message"
                ></p>

            </form>

        </div>

    </main>


    <script src="/frontend/scripts/i18n.js"></script>
    <script src="/frontend/scripts/language-selector.js"></script>
    <script src="/frontend/scripts/auth.js"></script>
    <script src="/frontend/scripts/farmer-profile.js"></script>
    <!-- PERSISTENT FLOATING VOICE ASSISTANT (SAATHI) -->
    <a href="/frontend/pages/voice-assistant.html?from_page=farmer-profile" class="floating-voice-widget" aria-label="Open Saathi Voice Assistant"
        title="Voice Farming Assistant / आवाज से पूछें">
        <div class="voice-mic-icon-box">
            <div class="voice-pulse-ring"></div>
            🎙️
        </div>
        <span class="voice-widget-label" data-i18n="nav.voiceAssistant">Voice AI</span>
    </a>

</body>

</html>
