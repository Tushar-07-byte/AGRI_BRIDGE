<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriBridge - Choose Your Role</title>
    <link rel="stylesheet" href="/styles/choose-roles.css">
</head>
<body>

    <main class="container">
        <div class="signup-card">
            
            <header class="card-header">
                <h2>Join AgriBridge</h2>
                <p>Select your role to get started on the platform.</p>
            </header>

            <form id="role-form" action="#" method="POST">
                <div class="form-group">
                    <label for="choose-role">I am a...</label>
                    <select id="choose-role" name="role" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="farmer">🌾 Farmer</option>
                        <option value="buyer">🛒 Buyer</option>
                        <option value="field-agent">📋 Field Agent</option>
                    </select>
                </div>

                <button type="submit" id="continue-btn" class="primary-btn">
                    Continue
                </button>
            </form>

        </div>
    </main>

    <script src="/scripts/choose_role.js"></script>
</body>
</html>
