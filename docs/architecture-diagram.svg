  <text x="200" y="488" fill="#fef3c7" font-size="11" text-anchor="middle">PENDING &gt; ACK &gt; IN_PROGRESS &gt; COMPLETED</text>

  <rect x="360" y="445" width="260" height="55" rx="8" fill="url(#gradAmber)"/>
  <text x="490" y="470" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Weather Auto-Rescheduler</text>
  <text x="490" y="488" fill="#fef3c7" font-size="11" text-anchor="middle">Rain Delay &amp; Window Rechecks</text>

  <rect x="650" y="445" width="270" height="55" rx="8" fill="url(#gradAmber)"/>
  <text x="785" y="470" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Field Agent Escalation</text>
  <text x="785" y="488" fill="#fef3c7" font-size="11" text-anchor="middle">Human Review for Confidence &lt;65%</text>

  <rect x="50" y="550" width="900" height="110" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="70" y="580" fill="#c084fc" font-size="14" font-weight="bold">LAYER 4: KISAN SAATHI COMPANION &amp; USER TOUCHPOINTS</text>

  <rect x="70" y="595" width="400" height="50" rx="8" fill="url(#gradPurple)"/>
  <text x="270" y="625" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Kisan Saathi Multilingual Voice AI (14 Languages)</text>

  <rect x="500" y="595" width="420" height="50" rx="8" fill="url(#gradPurple)"/>
  <text x="710" y="625" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Farmer Web App &amp; Live Crop Marketplace</text>
