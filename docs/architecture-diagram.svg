<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background:#0f172a; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <text x="500" y="45" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">AgriBridge Canonical Multi-Agent Architecture</text>
  <text x="500" y="70" fill="#94a3b8" font-size="14" text-anchor="middle">Autonomous Farm-to-Field Advisory &amp; Action Orchestration Platform</text>

  <rect x="50" y="100" width="900" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="130" fill="#38bdf8" font-size="14" font-weight="bold">LAYER 1: MULTI-SIGNAL INGESTION &amp; PERCEPTION</text>
  
  <rect x="70" y="145" width="190" height="50" rx="8" fill="url(#gradBlue)"/>
  <text x="165" y="175" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">IoT Sensor Telemetry</text>
  
  <rect x="290" y="145" width="190" height="50" rx="8" fill="url(#gradBlue)"/>
  <text x="385" y="175" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Vision Disease AI (4 Crops)</text>

  <rect x="510" y="145" width="190" height="50" rx="8" fill="url(#gradBlue)"/>
  <text x="605" y="175" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Open-Meteo Weather API</text>

  <rect x="730" y="145" width="190" height="50" rx="8" fill="url(#gradBlue)"/>
  <text x="825" y="175" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Mandi MSP Market DB</text>

  <rect x="50" y="240" width="900" height="130" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="70" y="270" fill="#34d399" font-size="14" font-weight="bold">LAYER 2: DETERMINISTIC DECISION CORE (SOLE AUTHORITY)</text>

  <rect x="70" y="285" width="260" height="65" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="200" y="312" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Farm Decision Context</text>
  <text x="200" y="332" fill="#94a3b8" font-size="11" text-anchor="middle">Traceable, Immutable Signals</text>

  <rect x="360" y="285" width="280" height="65" rx="8" fill="url(#gradPrimary)"/>
  <text x="500" y="312" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">MultiSignalPolicyEngine</text>
  <text x="500" y="332" fill="#d1fae5" font-size="11" text-anchor="middle">Deterministic Policy &amp; Safety Checks</text>

  <rect x="670" y="285" width="250" height="65" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="795" y="312" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Spray &amp; Timing Rules</text>
  <text x="795" y="332" fill="#94a3b8" font-size="11" text-anchor="middle">Rain &lt;60%, Wind &lt;20km/h Guard</text>

  <rect x="50" y="400" width="900" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="430" fill="#fbbf24" font-size="14" font-weight="bold">LAYER 3: ORCHESTRATION &amp; FIELD EXECUTION</text>

  <rect x="70" y="445" width="260" height="55" rx="8" fill="url(#gradAmber)"/>
