<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | AgriBridge Platform</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/frontend/styles/global.css">
    <link rel="stylesheet" href="/frontend/styles/login.css">
</head>

<body class="login-body">

    <div class="login-wrapper">

        <!-- BRAND HEADER -->
        <header class="login-header">
            <a href="/frontend/pages/index.html" class="login-logo-link">
                <img src="/frontend/assets/logo/logo.png" alt="AgriBridge Logo" class="login-logo">
            </a>
        </header>

        <!-- MAIN LOGIN CARD -->
        <main class="login-card">

            <div class="card-intro">
                <div class="intro-badge">SECURE PLATFORM LOGIN</div>
                <h2>Sign in to AgriBridge</h2>
                <p>Select your account role and enter your credentials to access your portal.</p>
            </div>

            <!-- ROLE SELECTOR TABS -->
            <div class="role-tabs-bar" role="tablist">
                <button type="button" class="role-tab-btn active" data-role="farmer">
                    <span class="tab-icon">🌾</span>
                    <span class="tab-label">Farmer</span>
                </button>
                <button type="button" class="role-tab-btn" data-role="buyer">
                    <span class="tab-icon">🛒</span>
                    <span class="tab-label">Buyer</span>
                </button>
                <button type="button" class="role-tab-btn" data-role="field-agent">
                    <span class="tab-icon">📋</span>
                    <span class="tab-label">Agent</span>
                </button>
                <button type="button" class="role-tab-btn" data-role="admin">
                    <span class="tab-icon">👑</span>
                    <span class="tab-label">Admin</span>
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="actual-login-form" class="login-form">

                <input type="hidden" id="selected-role-input" name="role" value="farmer">

                <!-- EMAIL / IDENTIFIER -->
                <div class="form-group">
                    <label for="login-email" id="email-label">Email or Phone Number</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="login-email" name="email" placeholder="e.g. ramesh@agrifarm.in" required autocomplete="username">
                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="login-password">Password</label>
                        <a href="javascript:void(0)" class="forgot-link" onclick="alert('Password reset link sent to registered phone/email.')">Forgot?</a>
                    </div>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="login-password" name="password" placeholder="Enter your password..." required autocomplete="current-password">
                        <button type="button" class="toggle-pwd-btn" id="toggle-pwd-btn" title="Show/Hide Password">👁️</button>
                    </div>
                </div>

                <!-- REMEMBER ME -->
                <div class="form-options">
                    <label class="remember-wrap">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Remember my login</span>
                    </label>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="submit-login-btn" id="login-submit-btn">
                    <span>Sign In to Portal →</span>
                </button>

                <!-- STATUS MESSAGE -->
                <div class="login-status-msg" id="login-status-msg" style="display: none;"></div>

            </form>

            <!-- ONE-CLICK QUICK DEMO LOGINS -->
            <div class="demo-logins-box">
                <div class="demo-title">⚡ ONE-CLICK DEMO TEST ACCOUNTS:</div>
                <div class="demo-chips-grid">
                    <button type="button" class="demo-chip" data-autofill="farmer">🌾 Farmer Demo</button>
                    <button type="button" class="demo-chip" data-autofill="buyer">🛒 Buyer Demo</button>
                    <button type="button" class="demo-chip" data-autofill="field-agent">📋 Field Agent</button>
                    <button type="button" class="demo-chip" data-autofill="admin">👑 Admin Demo</button>
                </div>
            </div>

            <!-- FOOTER SWITCH -->
            <div class="card-footer-switch">
                <span>Don't have an account yet?</span>
                <a href="/frontend/pages/signup.html">Register Account</a>
            </div>

        </main>

    </div>

    <!-- SCRIPTS -->
    <script src="/frontend/scripts/login.js"></script>

</body>

</html>
